<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Electorate Mapper</title>

    <style>
        select {
            font-size: 16px;
            padding: 5px;
            margin: 5px;
        }

    #mapframe {
        width: 100%;
        height: 800px;
        border: none;
    }

    @media (max-width: 700px) {
        #mapframe {
            height: 70vh;
        }
    }

    table {
        border-collapse: collapse;
    }

    td, th {
        padding: 3px 6px;
    }
</style>

</head>

<body>

<h3>
    <title>Electorate Mapper</title>

    <select id="electorate">
        <option value="Auburn">Auburn</option>
        <option value="Granville">Granville</option>
        <option value="Newtown">Newtown</option>
        <option value="Summer Hill">Summer Hill</option>
        <option value="Wallsend">Wallsend</option>
        <option value="Wollongong">Wollongong</option>
    </select>

    <select id="type">
        <option value="summary">Summary</option>
        <option value="services">Services</option>
        <option value="languages">Languages</option>
        <option value="ancestries">Ancestries</option>
        <option value="nationalities">Nationalities</option>
        <option value="religions">Religions</option>
        <option value="industries">Industries</option>
    </select>
</h3>

<iframe
    name="mapframe"
    id="mapframe"
    width="100%"
    height="800"
    style="border:none;"
></iframe>
<br>
<br>
<iframe
    name="tableframe"
    id="tableframe"
    width="100%"
    height="800"
    style="border:none;"
></iframe>
<br>
<iframe
    name="tableframe1"
    id="tableframe1"
    width="100%"
    height="800"
    style="border:none;"
></iframe>

<script>
    const electorate = document.getElementById("electorate");
    const type = document.getElementById("type");
    const mapframe = document.getElementById("mapframe");
    const tableframe = document.getElementById("tableframe");
    const tableframe1 = document.getElementById("tableframe1");


    function loadMap() {
        mapframe.src =
            "output/heatmaps/" + electorate.value + "_" +
            type.value + "_2021.html";
    }

    electorate.addEventListener("change", () => {
        loadMap();
        loadSummaryTables();
    });

    type.addEventListener("change", () => {
        loadMap();
        loadSummaryTables();
    });

    loadMap();
    loadSummaryTables();

    function loadSummaryTables() {

        if (type.value === "summary") {
            loadTable("summary", tableframe);
            loadTable("none", tableframe1);

        }

        if (type.value === "services") {
            loadTable("summary", tableframe);
            loadTable("none", tableframe1);

        }

        if (type.value === "languages") {
            loadTable("languages", tableframe);
            loadTable("language_proficiency", tableframe1);
        }

        if (type.value === "ancestries") {
            loadTable("ancestries", tableframe);
            loadTable("summary", tableframe1);

        }

        if (type.value === "nationalities") {
            loadTable("nationalities", tableframe);
            loadTable("summary", tableframe1);

        }

        if (type.value === "religions") {
            loadTable("religions", tableframe);
            loadTable("summary", tableframe1);

        }

        if (type.value === "industries") {
            loadTable("industries", tableframe);
            loadTable("summary", tableframe1);

        }
    }

       function loadTable(name, table) {
        if (name === "none"){
            table.src = "";
            return;
        }
        table.src =
            "output/heatmaps/" + electorate.value +
            "_" + name + "_table_2021.html";
    }
    
</script>

</body>
</html>
